# Guardia del equipo de EternalGrowth: revisa cada PR con Claude y comenta el resultado.
# Gasta del plan de Claude (no de la API). Requiere el secreto CLAUDE_CODE_OAUTH_TOKEN
# (se genera con `claude setup-token` y se guarda con `gh secret set CLAUDE_CODE_OAUTH_TOKEN`).
name: Guardia

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
    branches: [develop, main, master]

concurrency:
  group: guardia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guardia:
    if: github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'dinero')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Falta el secreto CLAUDE_CODE_OAUTH_TOKEN. La guardia no revisa este PR hasta que se configure."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          use_sticky_comment: "true"
          prompt: |
            Repositorio: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }} -> ${{ github.event.pull_request.base.ref }})
            Etiquetas: ${{ join(github.event.pull_request.labels.*.name, ', ') }}

            Eres la guardia del equipo. Lee .github/claude/guardia.md y sigue esas instrucciones
            para revisar este PR. Publica el informe con `gh pr comment`.
          claude_args: >-
            --model ${{ (contains(github.event.pull_request.labels.*.name, 'dinero') || github.event.pull_request.base.ref != 'develop') && 'opus' || 'sonnet' }}
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(npm audit:*),Bash(pnpm audit:*)"
